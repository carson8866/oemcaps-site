  <!-- OEM Caps Custom Styles -->
  <style>
  /* =========================================================
     核心 CLS 修复补丁（已修复严重 Bug）

  /* 【严重Bug修复】仅对没有设置尺寸属性的图片生效，保护Logo等固定尺寸图片不被拉伸变形 */

  /* =========================================================
     原品牌样式（Logo 强制固定尺寸及白底）
     ========================================================= */
:root {
  --accent-color: #1a73e8;
  --nav-hover-color: #1a73e8;
  --nav-dropdown-hover-color: #1a73e8;
}
/* 强制修复 Logo 图片的尺寸和背景 */
.header .logo img {
  width: auto;
  height: 42px !important;
  max-width: none !important;
  margin-right: 12px;
  background: #ffffff !important;
  border-radius: 10px;
  padding: 5px 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
/* 强制修复 Footer Logo */
.footer .footer-about .logo img {
  width: auto;
  height: 46px !important;
  max-width: none !important;
  margin-right: 8px;
  background: #ffffff !important;
  border-radius: 10px;
  padding: 5px 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

/* ---------- Product Cards ---------- */
.products .product-card { background: var(--surface-color); border: 1px solid rgba(0,0,0,.06); border-radius: 12px; overflow: hidden; height: 100%; transition: box-shadow .3s ease, transform .3s ease; }
.products .product-card:hover { box-shadow: 0 14px 34px rgba(0,0,0,.12); transform: translateY(-5px); }
.products .product-img { position: relative; width: 100%; overflow: hidden; background: #f2f5f9; }
.products .product-img > img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.products .product-card:hover .product-img > img { transform: scale(1.1); }
.products .product-overlay { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 12px; background: rgba(6,6,6,.45); opacity: 0; transition: opacity .3s ease; }
.products .product-card:hover .product-overlay { opacity: 1; }
.products .product-overlay .preview-link { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fff; color: var(--accent-color); font-size: 20px; transition: .3s; }
.products .product-overlay .preview-link:hover { background: var(--accent-color); color: #fff; }
.products .product-overlay .inquiry-btn { background: var(--accent-color); color: #fff; font-family: var(--heading-font); font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 12px 24px; border-radius: 50px; transition: .3s; }
.products .product-overlay .inquiry-btn:hover { background: color-mix(in srgb, var(--accent-color), #000 15%); }
.products .product-info { padding: 18px 20px 20px; border-top: 1px solid rgba(0,0,0,.05); }
.products .product-info h4 { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: var(--heading-color); }
.products .product-info p { font-size: 13px; line-height: 1.5; margin: 0; color: color-mix(in srgb, var(--default-color), transparent 25%); }
@media (max-width: 575px) { .products .product-info p { font-size: 12px; } }

/* ---------- How We Work ---------- */
.process-card { display: flex; gap: 20px; align-items: flex-start; background: var(--surface-color); border: 1px solid rgba(0,0,0,.06); border-radius: 12px; padding: 24px; height: 100%; box-shadow: 0 6px 18px rgba(0,0,0,.05); transition: .3s; }
.process-card:hover { box-shadow: 0 14px 30px rgba(0,0,0,.1); transform: translateY(-3px); }
.process-card .process-img { position: relative; flex-shrink: 0; width: 150px; height: 150px; border-radius: 10px; overflow: hidden; }
.process-card .process-img img { width: 100%; height: 100%; object-fit: cover; }
.process-card .process-num { position: absolute; top: 10px; left: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-color); color: #fff; font-family: var(--heading-font); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.process-card h4 { font-size: 19px; font-weight: 700; margin-bottom: 10px; color: var(--heading-color); }
.process-card p { font-size: 14px; margin: 0; color: color-mix(in srgb, var(--default-color), transparent 20%); }
@media (max-width: 575px) { .process-card { flex-direction: column; } .process-card .process-img { width: 100%; height: auto; aspect-ratio: 16/9; } }

/* ---------- Factory stats + gallery ---------- */
.factory-stats .factory-stat { text-align: center; background: var(--surface-color); border: 1px solid rgba(0,0,0,.06); border-radius: 12px; padding: 34px 20px; box-shadow: 0 6px 18px rgba(0,0,0,.05); height: 100%; }
.factory-stats .factory-stat .stat-num { font-size: 46px; font-weight: 700; color: var(--accent-color); font-family: var(--heading-font); line-height: 1; }
.factory-stats .factory-stat .stat-num .suffix { font-size: 28px; }
.factory-stats .factory-stat p { margin: 10px 0 0; font-family: var(--heading-font); font-weight: 600; font-size: 15px; color: var(--heading-color); }
.factory-gallery .factory-img { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; box-shadow: 0 8px 22px rgba(0,0,0,.08); }
.factory-gallery .factory-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.factory-gallery .factory-img:hover img { transform: scale(1.06); }

/* ---------- Review cards ---------- */
.review-card { background: var(--surface-color); border: 1px solid rgba(0,0,0,.06); border-radius: 12px; padding: 26px 22px; height: 100%; box-shadow: 0 6px 18px rgba(0,0,0,.05); display: flex; flex-direction: column; }
.review-card .review-quote { font-size: 32px; line-height: 0; color: color-mix(in srgb, var(--accent-color), transparent 45%); margin-bottom: 14px; }
.review-card .stars { color: #ffc107; font-size: 14px; margin-bottom: 12px; }
.review-card p { font-size: 13.5px; font-style: italic; line-height: 1.6; margin: 0 0 18px; color: color-mix(in srgb, var(--default-color), transparent 10%); }
.review-card .review-author { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.review-card .review-avatar { font-size: 44px; line-height: 0; color: color-mix(in srgb, var(--accent-color), transparent 30%); flex-shrink: 0; }
.review-card .review-author h4 { font-size: 15px; font-weight: 700; margin: 0 0 2px; color: var(--heading-color); }
.review-card .review-role { font-size: 12px; color: color-mix(in srgb, var(--default-color), transparent 30%); }
.reviews .swiper-slide { height: auto; padding: 8px; }

/* ---------- Floating WhatsApp button ---------- */
.wa-float { position: fixed; bottom: 24px; left: 24px; z-index: 999; width: 54px; height: 54px; border-radius: 50%; background: #25d366; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 6px 18px rgba(37,211,102,.45); transition: .3s; }
.wa-float:hover { transform: translateY(-4px); color: #fff; background: #1ebe5b; }

/* ---------- Customization cards ---------- */
.decor-item { background: var(--surface-color); border: 1px solid rgba(0,0,0,.06); border-radius: 12px; padding: 26px 22px; height: 100%; box-shadow: 0 6px 18px rgba(0,0,0,.05); transition: .3s; }
.decor-item:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.1); }
.decor-item .icon { font-size: 36px; line-height: 0; color: var(--accent-color); margin-bottom: 14px; }
.decor-item h4 { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--heading-color); }
.decor-item p { font-size: 13.5px; margin: 0; color: color-mix(in srgb, var(--default-color), transparent 15%); }

/* ---------- Trust band ---------- */
.trust-band { background: var(--accent-color); color: #fff; padding: 20px 0; }
.trust-band .trust-item { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--heading-font); font-weight: 600; font-size: 14px; text-align: left; }
.trust-band .trust-item i { font-size: 22px; flex-shrink: 0; }
@media (max-width: 767px) { .trust-band .trust-item { justify-content: flex-start; padding: 6px 0; } }

/* ---------- Contact form + contact info card ---------- */
.contact-form-card { background: #ffffff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 32px; height: 100%; }
.contact-form-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--heading-color); }
.contact-form-sub { font-size: 13.5px; color: color-mix(in srgb, var(--default-color), transparent 30%); margin-bottom: 22px; }
.contact-form-card .form-label { font-weight: 600; font-size: 13.5px; color: var(--heading-color); }
.contact-form-card .form-control { border: 1px solid #e3e8ef; border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.contact-form-card .form-control:focus { border-color: #0EA5E9; box-shadow: 0 0 0 .2rem rgba(14,165,233,.15); }
.btn-send-inquiry { background: #0EA5E9; color: #fff; font-weight: 600; font-size: 15px; letter-spacing: .5px; padding: 13px 28px; border-radius: 50px; width: 100%; border: 0; transition: .3s; }
.btn-send-inquiry:hover { background: #0284c7; color: #fff; }
.contact-info-card { background: #ffffff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 32px 26px; height: 100%; }
.contact-info-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--heading-color); display: flex; align-items: center; gap: 8px; }
.contact-info-title i { color: #0EA5E9; }
.contact-info-item { display: flex; gap: 14px; margin-bottom: 20px; }
.contact-info-icon { width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: rgba(14,165,233,.12); color: #0EA5E9; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.contact-info-item h4 { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--heading-color); }
.contact-info-item p { font-size: 13.5px; margin: 0; color: color-mix(in srgb, var(--default-color), transparent 20%); line-height: 1.6; }
.contact-info-item a { color: var(--heading-color); }
.contact-info-item a:hover { color: #0EA5E9; }
.btn-wa { background: #25d366; color: #fff; font-weight: 600; border-radius: 50px; padding: 12px 20px; margin-top: 8px; }
.btn-wa:hover { background: #1ebe5b; color: #fff; }

/* ---------- Static hero ---------- */
.hero { min-height: 100vh; overflow: hidden; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.hero .hero-overlay { position: absolute; inset: 0; background: rgba(6, 6, 6, 0.45); z-index: 2; }
.hero .hero-content { position: absolute; inset: 90px 64px 64px 64px; display: flex; justify-content: center; align-items: center; flex-direction: column; text-align: center; z-index: 3; }
@media (max-width: 575px) { .hero .hero-content { inset: 80px 20px 20px 20px; } }

/* ---------- Mobile fine-tuning ---------- */
@media (max-width: 575px) {
  .header .logo img { max-height: 32px; border-radius: 7px; padding: 3px 5px; height: 32px !important; }
  .header .logo h1 { font-size: 23px; }

  .products .product-info { padding: 12px 12px 14px; }
  .products .product-info h4 { font-size: 15px; }
  .products .product-info p { font-size: 11px; }
    .products .product-overlay .inquiry-btn { padding: 9px 16px; font-size: 12px; }
  .factory-stats .factory-stat .stat-num { font-size: 32px; }
  .factory-stats .factory-stat .stat-num .suffix { font-size: 20px; }
  .factory-stats .factory-stat { padding: 22px 10px; }
  .factory-stats .factory-stat p { font-size: 13px; }
  .process-card { padding: 18px; }
  .section-title { padding-bottom: 40px; }
}
@media (max-width: 480px) {
  .hero h2 { font-size: 24px; }
  .hero p { font-size: 14px; line-height: 1.6; }
  .review-card p { font-size: 12.5px; }
  .faq .faq-container .faq-item h3 { font-size: 14.5px; }
}
@media (min-width: 992px) {
  .process-card .process-img { width: 170px; height: 170px; }
}
